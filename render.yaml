services:
  - type: web
    name: college-rag-chatbot
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SIMILARITY_THRESHOLD
        value: "0.15"
      - key: TOP_K_CHUNKS
        value: "5"
      - key: CORS_ORIGINS
        value: "*"
